name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline chronology tests
        run: python -m unittest discover -s historical -p 'test_*.py' -v
      - name: Run offline source and parser tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
